services:
  mongo:
    image: mongo:7
    container_name: order_mongo
    restart: always

    volumes:
      - mongo_data:/data/db

    environment:
      MONGO_INITDB_DATABASE: order-management

    networks:
      - app_network

  backend:
    build:
      context: ./order-management-BE
      dockerfile: Dockerfile

    container_name: order_backend
    restart: always

    ports:
      - "5000:5000"

    env_file:
      - ./order-management-BE/.env

    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/order-management

    depends_on:
      - mongo

    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
